# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS SECURITY SCAN — Bandit (Unified Config)
# Combine le workflow CI et la configuration du linter en un seul fichier.
# ═══════════════════════════════════════════════════════════════════════════════

name: Security Scan (Bandit)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: "🛡️ Bandit Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Bandit Config
        run: |
          # Génération du fichier .bandit à la volée
          cat << 'EOF' > .bandit
          [bandit]
          exclude = .git,__pycache__,build,dist,tests,venv,.venv
          skips = B101,B311,B404,B603,B607
          level = MEDIUM
          confidence = HIGH
          EOF

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit Scan
        id: bandit-scan
        run: |
          # On utilise le fichier de config généré à l'étape précédente
          bandit -r . -c .bandit -f sarif -o bandit-results.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif

      - name: Fail on Critical/High findings
        run: |
          # Si le fichier SARIF contient des erreurs critiques, on bloque le pipeline
          if grep -q '"level": "error"' bandit-results.sarif 2>/dev/null; then
            echo "::error::Failles critiques détectées. Vérifiez l'onglet Security."
            exit 1
          else
            echo "✓ Code sécurisé."
          fi
