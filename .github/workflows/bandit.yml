# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS SECURITY — Bandit SAST (Production Grade)
# Détecte les vulnérabilités Python et les affiche dans l'onglet Security.
# Bloque la PR si une faille HIGH est trouvée.
# ═══════════════════════════════════════════════════════════════════════════════

name: Bandit Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Scan automatique chaque dimanche à 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bandit:
    name: "🛡️ Bandit Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Create Bandit Config
        run: |
          # Configuration stricte pour éviter les faux positifs tout en bloquant les vraies failles
          cat << 'EOF' > .bandit
          [bandit]
          exclude = .git,__pycache__,build,dist,tests,venv,.venv,.github
          skips = B101,B311,B404,B603,B607
          level = MEDIUM
          confidence = HIGH
          EOF

      - name: Run Bandit Scan (SARIF)
        run: |
          # Génération du fichier SARIF pour GitHub Security
          bandit -r . -c .bandit -f sarif -o bandit-results.sarif || true
          
          # Génération d'un rapport JSON pour la vérification manuelle
          bandit -r . -c .bandit -f json -o bandit-results.json || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Check for Critical/High findings
        run: |
          # Vérification stricte : si des erreurs HIGH sont trouvées, le pipeline échoue
          if grep -q '"level": "error"' bandit-results.sarif 2>/dev/null; then
            echo "::error::Failles de sécurité critiques détectées. Consultez l'onglet Security pour les détails."
            exit 1
          else
            echo "✓ Aucune faille critique détectée. Code sécurisé."
          fi

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: |
            bandit-results.json
            bandit-results.sarif
          retention-days: 7
