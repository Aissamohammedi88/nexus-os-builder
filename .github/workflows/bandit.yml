# ═══════════════════════════════════════════════════════════════════════════════
# BANDIT SECURITY SCAN — OFFICIAL PyCQA ACTION
# Uses the official Bandit Action maintained by the PyCQA team.
# Scans Python code for common security issues and uploads results to GitHub Security.
# ═══════════════════════════════════════════════════════════════════════════════

name: Bandit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Weekly scan every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bandit:
    name: "🛡️ Bandit Security Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          # Python version to use
          python-version: '3.12'
          # Path(s) to scan (default: current directory)
          targets: .
          # Exclude test and build directories
          exclude: '.git,__pycache__,build,dist,tests,venv,.venv,node_modules'
          # Only report issues of HIGH severity and HIGH confidence to avoid noise
          severity: 'high'
          confidence: 'high'
          # Optional: path to a custom .bandit config file
          # configfile: '.bandit'
          # Optional: path to a baseline report for comparison
          # baseline: 'baseline.json'
